
<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>Sandeep Konda | DevOps Engineer | AWS Cloud & Automation</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Welcome to Sandeep Konda's portfolio. DevOps Engineer specializing in AWS, Terraform, Docker, Kubernetes, CI/CD pipelines, cloud infrastructure, automation, and deployment."
    />

    <meta
      name="keywords"
      content="Sandeep Konda, Sandeep Konda DevOps Engineer, DevOps Engineer, AWS Engineer, AWS Cloud, Terraform, Docker, Kubernetes, CI/CD, GitHub Actions, Cloud Infrastructure, DevOps Portfolio, Automation Engineer"
    />

    <meta name="author" content="Sandeep Konda" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL: Replace with your actual portfolio domain -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#080d1a" />

    <!-- Open Graph SEO (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sandeep Konda | DevOps Engineer" />
    <meta
      property="og:description"
      content="Explore Sandeep Konda's DevOps portfolio, featuring AWS cloud infrastructure, Terraform, Docker, Kubernetes, CI/CD automation, and engineering projects."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="Sandeep Konda Portfolio" />
    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.png"
    />

    <!-- Twitter / X SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sandeep Konda | DevOps Engineer"
    />
    <meta
      name="twitter:description"
      content="DevOps Engineer specializing in AWS, Terraform, Docker, Kubernetes, CI/CD pipelines, and cloud automation."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Person / Professional Profile -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sandeep Konda",
        "jobTitle": "DevOps Engineer",
        "url": "https://yourdomain.com/",
        "knowsAbout": [
          "DevOps",
          "Amazon Web Services",
          "Terraform",
          "Docker",
          "Kubernetes",
          "CI/CD",
          "GitHub Actions",
          "Cloud Infrastructure",
          "Automation"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
